name: Deploy Flutter web
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: gym_tracker/gym_tracker/gym_tracker
      - run: flutter build web --release --base-href "/gym-tracker/"
        working-directory: gym_tracker/gym_tracker/gym_tracker
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gym_tracker/gym_tracker/gym_tracker/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
